# Auto-build workflow for ipxrelay
# - Runs on a weekly schedule to keep GitHub Actions active and to rebuild when parent images may have changed.
# - Also supports manual dispatch and repository_dispatch (you can trigger from another repo when upstream changes).
# - Only pushes the image if the upstream repository (fragglet/ipxbox) has a new commit.

name: Auto build and publish

on:
  schedule:
    # Run weekly at 03:00 UTC on Sunday
    - cron: '0 3 * * 0'
  workflow_dispatch: {}
  repository_dispatch: {}
  push:
    branches:
      - master

concurrency:
  group: ipxrelay-build
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    env:
      UPSTREAM_REPO: fragglet/ipxbox
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Determine image name
        id: image
        run: |
          set -euo pipefail
          REPO=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "image=ghcr.io/${REPO}" >> "$GITHUB_OUTPUT"

      - name: Fetch upstream info
        id: upstream
        uses: actions/github-script@v8
        with:
          script: |
            const owner = "fragglet";
            const repo = "ipxbox";
            const { data: repoInfo } = await github.rest.repos.get({ owner, repo });
            const defaultBranch = repoInfo.default_branch;
            const { data: commit } = await github.rest.repos.getCommit({ owner, repo, ref: defaultBranch });
            core.setOutput('branch', defaultBranch);
            core.setOutput('sha', commit.sha);

      - name: Install regctl
        uses: regclient/actions/regctl-installer@main

      - name: Capture base image digests
        id: base
        run: |
          set -euo pipefail
          BUILD_IMAGE="golang:alpine"
          RUNTIME_IMAGE="alpine:latest"
          BUILD_DIGEST=$(regctl image digest "docker.io/library/${BUILD_IMAGE}")
          RUNTIME_DIGEST=$(regctl image digest "docker.io/library/${RUNTIME_IMAGE}")
          echo "build_ref=${BUILD_IMAGE}@${BUILD_DIGEST}" >> "$GITHUB_OUTPUT"
          echo "runtime_ref=${RUNTIME_IMAGE}@${RUNTIME_DIGEST}" >> "$GITHUB_OUTPUT"
          echo "build_digest=${BUILD_DIGEST}" >> "$GITHUB_OUTPUT"
          echo "runtime_digest=${RUNTIME_DIGEST}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: regctl login
        uses: regclient/actions/regctl-login@main
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Inspect last published image
        id: last
        env:
          IMAGE: ${{ steps.image.outputs.image }}
        run: |
          set -euo pipefail
          if ! regctl manifest get "${IMAGE}:latest" --format '{{json .config.labels}}' > labels.json; then
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "found=true" >> "$GITHUB_OUTPUT"
          LAST_UPSTREAM=$(jq -r '."org.opencontainers.image.revision" // "none"' labels.json)
          LAST_BASE_BUILD=$(jq -r '."org.ipxrelay.base.build" // "none"' labels.json)
          LAST_BASE_RUNTIME=$(jq -r '."org.ipxrelay.base.runtime" // "none"' labels.json)

          echo "upstream_sha=${LAST_UPSTREAM}" >> "$GITHUB_OUTPUT"
          echo "base_build=${LAST_BASE_BUILD}" >> "$GITHUB_OUTPUT"
          echo "base_runtime=${LAST_BASE_RUNTIME}" >> "$GITHUB_OUTPUT"
          LAST_DIGEST=$(regctl image digest "${IMAGE}:latest")
          echo "image_digest=${LAST_DIGEST}" >> "$GITHUB_OUTPUT"

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.image }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ steps.upstream.outputs.branch }}-${{ steps.upstream.outputs.sha }}
            type=sha
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.upstream.outputs.sha }}
            org.ipxrelay.upstream.branch=${{ steps.upstream.outputs.branch }}
            org.ipxrelay.base.build=${{ steps.base.outputs.build_ref }}
            org.ipxrelay.base.runtime=${{ steps.base.outputs.runtime_ref }}

      - name: Decide whether to push
        id: decide
        uses: actions/github-script@v7
        env:
          EVENT_NAME: ${{ github.event_name }}
          UPSTREAM_SHA: ${{ steps.upstream.outputs.sha }}
          LAST_FOUND: ${{ steps.last.outputs.found }}
          LAST_UPSTREAM_SHA: ${{ steps.last.outputs.upstream_sha }}
          BASE_BUILD_REF: ${{ steps.base.outputs.build_ref }}
          BASE_RUNTIME_REF: ${{ steps.base.outputs.runtime_ref }}
          LAST_BASE_BUILD: ${{ steps.last.outputs.base_build }}
          LAST_BASE_RUNTIME: ${{ steps.last.outputs.base_runtime }}
        with:
          script: |
            const pushEvent = process.env.EVENT_NAME === 'push';
            const lastFound = process.env.LAST_FOUND === 'true';
            const diffs = [];
            if (!lastFound) {
              diffs.push('no_previous_image');
            }
            if (process.env.UPSTREAM_SHA && process.env.UPSTREAM_SHA !== (process.env.LAST_UPSTREAM_SHA || '')) {
              diffs.push('upstream_changed');
            }
            if (process.env.BASE_BUILD_REF && process.env.BASE_BUILD_REF !== (process.env.LAST_BASE_BUILD || '')) {
              diffs.push('builder_base_changed');
            }
            if (process.env.BASE_RUNTIME_REF && process.env.BASE_RUNTIME_REF !== (process.env.LAST_BASE_RUNTIME || '')) {
              diffs.push('runtime_base_changed');
            }
            const shouldPush = pushEvent || diffs.length > 0;
            core.setOutput('push', shouldPush ? 'true' : 'false');
            core.setOutput('reasons', diffs.join(','));

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          buildkitd-flags: --debug

      - name: Build image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ steps.decide.outputs.push == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build summary
        run: |
          echo "Push decision: ${{ steps.decide.outputs.push }}"
          echo "Reasons: ${{ steps.decide.outputs.reasons }}"
          echo "Image tags:"
          echo '${{ steps.meta.outputs.tags }}'
